server_tokens off;
types {
  application/manifest+json webmanifest;
}

server {
  listen 8080;
  absolute_redirect off;
  port_in_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  location = /.well-known/security.txt {
    default_type text/plain;
    return 200 "Contact: https://github.com/povedica/tick-tack-done/security/advisories/new\nExpires: 2027-10-19T00:00:00.000Z\nPreferred-Languages: es, en\n";
  }

  location ~ /\.(?!well-known) {
    return 404;
  }

  location ~* \.(env|yml|yaml|json|md|sql|map|bak)$ {
    return 404;
  }

  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.json {
    return 308 /manifest.webmanifest;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
