name: Render private runtime env
description: Resolve references on the runner and write an atomic 0600 file
inputs:
  template:
    required: true
    description: Versioned template containing references only
  output:
    required: true
    description: Private runner temporary path
runs:
  using: composite
  steps:
    - uses: 1password/install-cli-action@v2
    - shell: bash
      env:
        TEMPLATE: ${{ inputs.template }}
        OUTPUT_FILE: ${{ inputs.output }}
      run: bash scripts/secrets/render-env.sh "$TEMPLATE" "$OUTPUT_FILE"
