name: Render private runtime env
description: Read a 1Password Environment on the runner and write an atomic 0600 file
inputs:
  output:
    required: true
    description: Private runner temporary path
runs:
  using: composite
  steps:
    - uses: 1password/install-cli-action@v2
      with:
        version: 2.42.0
    - shell: bash
      env:
        OUTPUT_FILE: ${{ inputs.output }}
      run: bash scripts/secrets/render-env.sh "$OP_ENVIRONMENT_ID" "$OUTPUT_FILE"
