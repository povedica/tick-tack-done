name: Workspace setup
description: Node 26, pnpm store and source-keyed domain build
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - uses: actions/cache@v4
      id: domain
      with:
        path: packages/domain/dist
        key: domain-${{ runner.os }}-${{ hashFiles('packages/domain/**', 'tsconfig.base.json', 'pnpm-lock.yaml') }}
    - if: steps.domain.outputs.cache-hit != 'true'
      run: pnpm --filter @reflexionia/domain build
      shell: bash
