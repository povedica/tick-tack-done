name: CI

on:
  push:
    branches: [main]
  # edited so a body change cannot leave a stale ci-ok. The other jobs rerun
  # on that same SHA: a green edit must not replace a red test run.
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
      api: ${{ steps.filter.outputs.api }}
      browser: ${{ steps.filter.outputs.browser }}
      tooling: ${{ steps.filter.outputs.tooling }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/domain/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'tsconfig*'
              - '.github/**'
              - 'scripts/!(backlog)/**'
              - 'scripts/*'
            code:
              - *shared
              - 'apps/**'
              - 'packages/**'
              - 'eslint*'
            api:
              - *shared
              - 'apps/api/**'
            browser:
              - *shared
              - 'apps/web/**'
              - 'packages/sdk/**'
              - 'apps/api/src/auth/**'
              - 'apps/api/src/health/**'
            tooling:
              - '.github/**'
              - 'deploy/**'
              - 'scripts/**'

  code-checks:
    env:
      FORMAT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      quality: ${{ steps.checks.outputs.quality }}
      unit: ${{ steps.checks.outputs.unit }}
      openapi: ${{ steps.checks.outputs.openapi }}
      browser: ${{ steps.checks.outputs.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          build-api: ${{ github.event_name == 'push' || needs.changes.outputs.api == 'true' }}
      - name: Fail fast on formatting before launching expensive checks
        run: pnpm format:check
      - name: Resolve installed Playwright version
        if: github.event_name == 'push' || needs.changes.outputs.browser == 'true'
        id: playwright
        run: echo "version=$(pnpm --filter web exec playwright --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: github.event_name == 'push' || needs.changes.outputs.browser == 'true'
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: (github.event_name == 'push' || needs.changes.outputs.browser == 'true') && steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium
      - if: (github.event_name == 'push' || needs.changes.outputs.browser == 'true') && steps.browsers.outputs.cache-hit == 'true'
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chrome-headless-shell \) -print -quit)
          if [[ -z "$browser" ]] || ldd "$browser" | grep -q 'not found'; then
            pnpm --filter web exec playwright install-deps chromium
          fi
      - id: checks
        name: Run independent checks concurrently on one runner
        env:
          RUN_UNIT: 'false'
          RUN_API: ${{ github.event_name == 'push' || needs.changes.outputs.api == 'true' }}
          RUN_BROWSER: ${{ github.event_name == 'push' || needs.changes.outputs.browser == 'true' }}
        run: bash scripts/ci/run-code-checks.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r80-browser-evidence
          path: |
            apps/web/test-results
            test-artifacts/audit/r80/98-waterfall-despues-*.json
          retention-days: 14

  quality:
    needs: [changes, code-checks]
    if: always() && (github.event_name == 'push' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - env:
          RESULT: ${{ needs.code-checks.outputs.quality }}
          PARENT: ${{ needs.code-checks.result }}
        run: test "$PARENT" = success && test "$RESULT" = 0

  test-unit:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:ci

  openapi-check:
    needs: [changes, code-checks]
    if: always() && (github.event_name == 'push' || needs.changes.outputs.api == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - env:
          RESULT: ${{ needs.code-checks.outputs.openapi }}
          PARENT: ${{ needs.code-checks.result }}
        run: test "$PARENT" = success && test "$RESULT" = 0

  r80-browser-contracts:
    needs: [changes, code-checks]
    if: always() && (github.event_name == 'push' || needs.changes.outputs.browser == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - env:
          RESULT: ${{ needs.code-checks.outputs.browser }}
          PARENT: ${{ needs.code-checks.result }}
        run: test "$PARENT" = success && test "$RESULT" = 0

  test-integration:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.api == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      CI_POSTGRES_USER: reflexionia
      CI_POSTGRES_PASSWORD: ci
      CI_POSTGRES_DB: reflexionia_test
      DATABASE_URL: postgresql://reflexionia:ci@localhost:5432/reflexionia_test
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ${{ env.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.CI_POSTGRES_DB }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reflexionia"
          --health-interval 1s --health-timeout 3s --health-retries 30
      postgres-shard2:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ${{ env.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.CI_POSTGRES_DB }}
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U reflexionia"
          --health-interval 1s --health-timeout 3s --health-retries 30
      postgres-shard3:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ${{ env.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.CI_POSTGRES_DB }}
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U reflexionia"
          --health-interval 1s --health-timeout 3s --health-retries 30
      postgres-shard4:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ${{ env.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.CI_POSTGRES_DB }}
        ports: ['5435:5432']
        options: >-
          --health-cmd "pg_isready -U reflexionia"
          --health-interval 1s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      redis-shard2:
        image: redis:7-alpine
        ports: ['6380:6379']
      redis-shard3:
        image: redis:7-alpine
        ports: ['6381:6379']
      redis-shard4:
        image: redis:7-alpine
        ports: ['6382:6379']
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          build-api: true
          api-only: true
      - name: Use the PostgreSQL service for backup tools
        run: |
          mkdir -p "$RUNNER_TEMP/pg-bin"
          for tool in pg_dump pg_restore; do
            cp scripts/ci/postgres-client.sh "$RUNNER_TEMP/pg-bin/$tool"
            chmod +x "$RUNNER_TEMP/pg-bin/$tool"
          done
          echo "$RUNNER_TEMP/pg-bin" >> "$GITHUB_PATH"
      - run: nproc
      - run: bash scripts/ci/run-integration.sh
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          POSTGRES_CONTAINER_SHARD2: ${{ job.services.postgres-shard2.id }}
          POSTGRES_CONTAINER_SHARD3: ${{ job.services.postgres-shard3.id }}
          POSTGRES_CONTAINER_SHARD4: ${{ job.services.postgres-shard4.id }}

  public-tree-guard:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Five cases on a temporary tree, then this checkout
        run: bash scripts/public-tree-guard.sh --self-test
      - name: Added and modified lines of a pull request
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          bash scripts/public-tree-guard.sh --diff-base "origin/${{ github.base_ref }}"

  docs-format:
    env:
      FORMAT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.code != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  infra-check:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.11
      - name: Validate CI shell scripts
        run: shellcheck scripts/ci/*.sh scripts/secrets/*.sh deploy/lib/*.sh deploy/staging/deploy.sh deploy/production/*.sh scripts/backup.sh scripts/dev.sh .cursor/setup-worktree-unix.sh
      - uses: actions/checkout@v7
        with:
          repository: dorny/paths-filter
          ref: v3
          path: .ci-tools/paths-filter
          persist-credentials: false
      - name: Test private env and deployment contracts offline
        env:
          PATHS_FILTER_ACTION: ${{ github.workspace }}/.ci-tools/paths-filter/dist/index.js
        run: |
          python3 -B -m unittest discover -s scripts/secrets -v
          python3 -B -m unittest discover -s scripts/deploy -v
          python3 -B -m unittest discover -s scripts/ci -v

  web:
    # F10. Static graph of the entry plus /calendar/:view (SPEC §5.4).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reflexionia/domain build
      - run: pnpm --filter web build
      - run: node scripts/check-bundle-budget.mjs apps/web/dist

  perf-k6:
    # F1. Ephemeral Postgres only. TOKEN_RATE_LIMIT_TEST is refused when NODE_ENV=production.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://reflexionia:ci@localhost:5432/reflexionia_perf
      REDIS_URL: redis://localhost:6379
      PERF_SEED: ephemeral
      PERF_PROFILE: x100
      NODE_ENV: development
      AUTH_MODE: session
      BUS_AUTOSTART: 'false'
      SCHEDULER_AUTOSTART: 'false'
      TOKEN_RATE_LIMIT_TEST: '100000'
      PORT: '3000'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: reflexionia
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: reflexionia_perf
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reflexionia"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reflexionia/domain build
      - run: pnpm db:deploy
      - name: Install k6
        run: |
          curl --fail --silent --show-error --location --output k6.tar.gz https://github.com/grafana/k6/releases/download/v0.57.0/k6-v0.57.0-linux-amd64.tar.gz
          tar --extract --gzip --file k6.tar.gz
          sudo mv k6-v0.57.0-linux-amd64/k6 /usr/local/bin/k6
      - name: Seed and measure the year view
        run: |
          password="$(openssl rand -hex 18)"
          export PERF_SEED_PASSWORD="$password"
          export PERF_MANIFEST="$RUNNER_TEMP/manifest.json"
          export PERF_TOKEN_FILE="$RUNNER_TEMP/token"
          export PERF_SESSION_FILE="$RUNNER_TEMP/session.json"
          pnpm --filter api exec tsx ../../scripts/seed-perf.ts
          pnpm --filter api build
          pnpm --filter api start >"$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 40); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/api/v1/health; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/api/v1/health
          TTD_TOKEN="$(cat "$PERF_TOKEN_FILE")" \
            TTD_BASE=http://127.0.0.1:3000 \
            TTD_MANIFEST="$PERF_MANIFEST" \
            TTD_SUMMARY_PATH="$RUNNER_TEMP/k6.json" \
            TTD_OPENS=8 \
            k6 run scripts/perf/k6-vista-anual.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-k6-summary
          path: ${{ runner.temp }}/k6.json
          retention-days: 14

  perf-k6-vista:
    # #109 §6.4. Seed S, ephemeral localhost only. Thresholds are CA-R4.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://reflexionia:ci@localhost:5432/reflexionia_perf
      REDIS_URL: redis://localhost:6379
      PERF_SEED: ephemeral
      PERF_PROFILE: s
      NODE_ENV: development
      AUTH_MODE: session
      BUS_AUTOSTART: 'false'
      SCHEDULER_AUTOSTART: 'false'
      TOKEN_RATE_LIMIT_TEST: '100000'
      PORT: '3000'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: reflexionia
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: reflexionia_perf
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reflexionia"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reflexionia/domain build
      - run: pnpm db:deploy
      - name: Install k6
        run: |
          curl --fail --silent --show-error --location --output k6.tar.gz https://github.com/grafana/k6/releases/download/v0.57.0/k6-v0.57.0-linux-amd64.tar.gz
          tar --extract --gzip --file k6.tar.gz
          sudo mv k6-v0.57.0-linux-amd64/k6 /usr/local/bin/k6
      - name: Seed S and gate the year-view calls
        run: |
          password="$(openssl rand -hex 18)"
          export PERF_SEED_PASSWORD="$password"
          export PERF_MANIFEST="$RUNNER_TEMP/manifest.json"
          export PERF_TOKEN_FILE="$RUNNER_TEMP/token"
          export PERF_SESSION_FILE="$RUNNER_TEMP/session.json"
          pnpm --filter api exec tsx ../../scripts/seed-perf.ts
          pnpm --filter api build
          pnpm --filter api start >"$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 40); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/api/v1/health; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/api/v1/health
          TTD_EPHEMERAL=1 \
            TTD_BASE=http://127.0.0.1:3000 \
            TTD_MANIFEST="$PERF_MANIFEST" \
            TTD_TOKEN_FILE="$PERF_TOKEN_FILE" \
            TTD_SUMMARY_PATH="$RUNNER_TEMP/k6-vista.json" \
            TTD_GATE=1 \
            k6 run scripts/perf/k6-vista-resumen.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-k6-vista-summary
          path: ${{ runner.temp }}/k6-vista.json
          retention-days: 14

  issue-link:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'edited' || github.event.action == 'synchronize' || github.event.action == 'reopened')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Require Closes #N of an open issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/issue_link.py

  ci-ok:
    if: always()
    needs:
      [
        changes,
        code-checks,
        quality,
        test-unit,
        test-integration,
        openapi-check,
        r80-browser-contracts,
        web,
        perf-k6,
        perf-k6-vista,
        public-tree-guard,
        docs-format,
        infra-check,
        issue-link,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
