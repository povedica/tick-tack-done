name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
      api: ${{ steps.filter.outputs.api }}
      browser: ${{ steps.filter.outputs.browser }}
      tooling: ${{ steps.filter.outputs.tooling }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/domain/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'tsconfig*'
              - '.github/**'
              - 'scripts/!(backlog)/**'
              - 'scripts/*'
            code:
              - *shared
              - 'apps/**'
              - 'packages/**'
              - 'eslint*'
            api:
              - *shared
              - 'apps/api/**'
            browser:
              - *shared
              - 'apps/web/**'
              - 'packages/sdk/**'
              - 'apps/api/src/auth/**'
              - 'apps/api/src/health/**'
            tooling:
              - '.github/**'
              - 'deploy/**'
              - 'scripts/**'

  quality:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint:ci
      - run: pnpm typecheck:ci

  test-unit:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:ci

  test-integration:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.api == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      CI_POSTGRES_USER: reflexionia
      CI_POSTGRES_PASSWORD: ci
      CI_POSTGRES_DB: reflexionia_test
      DATABASE_URL: postgresql://reflexionia:ci@localhost:5432/reflexionia_test
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ${{ env.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.CI_POSTGRES_DB }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reflexionia"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Use the PostgreSQL service for backup tools
        run: |
          mkdir -p "$RUNNER_TEMP/pg-bin"
          for tool in pg_dump pg_restore; do
            cp scripts/ci/postgres-client.sh "$RUNNER_TEMP/pg-bin/$tool"
            chmod +x "$RUNNER_TEMP/pg-bin/$tool"
          done
          echo "$RUNNER_TEMP/pg-bin" >> "$GITHUB_PATH"
      - run: pnpm db:deploy
      - run: pnpm --filter api exec nest build
      - run: pnpm --filter api exec vitest run --config vitest.config.integration.ts --shard=${{ matrix.shard }}/3
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}

  openapi-check:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.api == 'true'
    timeout-minutes: 15
    # Sección 18: el OpenAPI se genera del código y CI verifica que no hay endpoints sin documentar.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter api exec nest build
      - run: pnpm --filter api openapi:generate
      - name: El OpenAPI generado no debe tener diff sin commitear
        run: git diff --exit-code apps/api/openapi.json apps/api/src/mcp/api-operations.json

  r80-browser-contracts:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.browser == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter web build
      - name: Resolve installed Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter web exec playwright --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps chromium
      - name: Verify Agenda timing and Google, links, About and push UI contracts
        env:
          R80_PHASE: despues
          R80_PREVIEW: '1'
        run: pnpm --filter web exec playwright test --config playwright.r80.config.ts r80-agenda-performance.spec.ts r80-google.spec.ts r80-integrations.spec.ts r80-links.spec.ts r80-about.spec.ts r80-push-actions.spec.ts production-session.spec.ts password-reset.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r80-browser-evidence
          path: |
            apps/web/test-results
            test-artifacts/audit/r80/98-waterfall-despues-*.json
          retention-days: 14

  public-tree-guard:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Five cases on a temporary tree, then this checkout
        run: bash scripts/public-tree-guard.sh --self-test
      - name: Added and modified lines of a pull request
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          bash scripts/public-tree-guard.sh --diff-base "origin/${{ github.base_ref }}"

  docs-format:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  infra-check:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.11
      - name: Validate CI shell scripts
        run: shellcheck scripts/ci/*.sh scripts/secrets/*.sh deploy/lib/*.sh deploy/staging/deploy.sh deploy/production/*.sh scripts/backup.sh scripts/dev.sh .cursor/setup-worktree-unix.sh
      - name: Test private env and deployment contracts offline
        run: |
          python3 -B -m unittest discover -s scripts/secrets -v
          python3 -B -m unittest discover -s scripts/deploy -v

  ci-ok:
    if: always()
    needs:
      [
        changes,
        quality,
        test-unit,
        test-integration,
        openapi-check,
        r80-browser-contracts,
        public-tree-guard,
        docs-format,
        infra-check,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
