name: Deploy
on:
  workflow_run:
    workflows: [Images]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Full SHA from a successful Images run, or last-good
        required: true
        default: last-good
        type: string
permissions:
  contents: read
  actions: read
  packages: write
jobs:
  preflight:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - name: Require a changed image plan (docs never deploy)
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          IMAGE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          if [[ "$EVENT" == workflow_run ]]; then
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$IMAGE_RUN/artifacts" --jq '[.artifacts[] | select(.name == "deployment-plan" and .expired == false)] | length')
            [[ "$count" -gt 0 ]] || exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Check manual environments and production reviewer without creating them
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/staging" --silent
          gh api "repos/$GITHUB_REPOSITORY/environments/production" | jq -e '[.protection_rules[] | select(.type == "required_reviewers") | .reviewers[] | select(.reviewer.login == "povedica")] | length > 0' >/dev/null
      - id: target
        env:
          TARGET: ${{ github.event.workflow_run.head_sha || inputs.sha }}
        run: |
          [[ "$TARGET" == last-good || "$TARGET" =~ ^[a-fA-F0-9]{40}$ ]] || exit 64
          echo "sha=$TARGET" >> "$GITHUB_OUTPUT"
  deploy-staging:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      sha: ${{ needs.preflight.outputs.sha }}
      image-run: ${{ github.event.workflow_run.id && format('{0}', github.event.workflow_run.id) || '' }}
    secrets: inherit

  deploy-production:
    needs: [preflight, deploy-staging]
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      sha: ${{ needs.preflight.outputs.sha }}
      image-run: ${{ github.event.workflow_run.id && format('{0}', github.event.workflow_run.id) || '' }}
    secrets: inherit
