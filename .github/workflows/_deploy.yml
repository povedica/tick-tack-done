name: Deploy one environment
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      sha:
        type: string
        required: true
      image-run:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha == 'last-good' && 'main' || inputs.sha }}
      - name: Find immutable image plan and verify CI
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.sha }}
          IMAGE_RUN: ${{ inputs.image-run }}
        run: |
          if [[ "$TARGET" == last-good ]]; then exit 0; fi
          ci=0
          for _ in {1..30}; do
            ci=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$TARGET&status=success&per_page=10" --jq '[.workflow_runs[] | select(.head_branch == "main" and .event == "push")] | length')
            [[ "$ci" -gt 0 ]] && break
            sleep 10
          done
          [[ "$ci" -gt 0 ]] || { echo 'CI on main must pass before deployment' >&2; exit 1; }
          if [[ -z "$IMAGE_RUN" ]]; then
            IMAGE_RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/images.yml/runs?head_sha=$TARGET&status=success&per_page=10" --jq '.workflow_runs[0].id // empty')
          fi
          [[ "$IMAGE_RUN" =~ ^[0-9]+$ ]] || exit 1
          mkdir -p "$RUNNER_TEMP/plan"
          gh run download "$IMAGE_RUN" --repo "$GITHUB_REPOSITORY" --name deployment-plan --dir "$RUNNER_TEMP/plan"
          jq -e --arg sha "$TARGET" '.sha == $sha and (.api|type == "boolean") and (.web|type == "boolean")' "$RUNNER_TEMP/plan/plan.json" >/dev/null
          echo "web=$(jq -r .web "$RUNNER_TEMP/plan/plan.json")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: inputs.environment == 'production' && steps.plan.outputs.web == 'true'
      - uses: docker/login-action@v3
        if: inputs.environment == 'production' && steps.plan.outputs.web == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build production web only after staging and human approval
        if: inputs.environment == 'production' && steps.plan.outputs.web == 'true'
        env:
          TARGET: ${{ inputs.sha }}
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
        run: |
          image="ghcr.io/povedica/tick-tack-done-web:$TARGET-prod"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then exit 0; fi
          docker buildx build --push -f apps/web/Dockerfile \
            --tag "$image" --tag "ghcr.io/povedica/tick-tack-done-web:sha-${TARGET:0:7}-prod" \
            --build-arg "GIT_COMMIT=$TARGET" --build-arg "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg "VITE_RECAPTCHA_SITE_KEY=$VITE_RECAPTCHA_SITE_KEY" \
            --cache-from type=gha,scope=web-prod --cache-to type=gha,mode=max,scope=web-prod .
      - uses: ./.github/actions/render-env
        with:
          template: deploy/${{ inputs.environment }}/env.tpl
          output: ${{ runner.temp }}/runtime.env
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - name: Transfer deployment files and run pull-only deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
          RUNTIME_ENV_FILE: ${{ vars.RUNTIME_ENV_FILE }}
          PUBLIC_HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL }}
          TARGET: ${{ inputs.sha }}
          ENVIRONMENT: ${{ inputs.environment }}
          EDGE_NETWORK: ${{ vars.EDGE_NETWORK }}
          CADDY_SITES_DIR: ${{ vars.CADDY_SITES_DIR }}
          EDGE_CADDY_CONTAINER: ${{ vars.EDGE_CADDY_CONTAINER }}
        run: bash deploy/lib/remote.sh
      - name: Remove runner private files
        if: always()
        run: rm -f "$RUNNER_TEMP/runtime.env" "$RUNNER_TEMP/deploy-key" "$RUNNER_TEMP/known-hosts"
