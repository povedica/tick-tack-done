name: Deploy one environment
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      sha:
        type: string
        required: true
      image-run:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  preflight:
    permissions:
      contents: read
      actions: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 7
    outputs:
      image-run: ${{ steps.plan.outputs.image_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - name: Find immutable image plan and verify CI
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.sha }}
          IMAGE_RUN: ${{ inputs.image-run }}
        run: |
          ci=0
          for _ in {1..30}; do
            ci=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$TARGET&status=success&per_page=10" --jq '[.workflow_runs[] | select(.head_branch == "main" and .event == "push")] | length')
            [[ "$ci" -gt 0 ]] && break
            sleep 10
          done
          [[ "$ci" -gt 0 ]] || { echo 'CI on main must pass before deployment' >&2; exit 1; }
          if [[ -z "$IMAGE_RUN" ]]; then
            IMAGE_RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/images.yml/runs?head_sha=$TARGET&status=success&per_page=10" --jq '[.workflow_runs[] | select(.head_branch == "main" and .event == "push")][0].id // empty')
          fi
          [[ "$IMAGE_RUN" =~ ^[0-9]+$ ]] || { echo 'No successful Images run on main for target SHA' >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$IMAGE_RUN" | jq -e --arg sha "$TARGET" '.head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success"' >/dev/null || { echo 'Successful Images push on main required for exact SHA' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/plan"
          gh run download "$IMAGE_RUN" --repo "$GITHUB_REPOSITORY" --name deployment-plan --dir "$RUNNER_TEMP/plan" || { echo 'Deployment plan is missing or expired' >&2; exit 1; }
          jq -e --arg sha "$TARGET" '.sha == $sha and (.api|type == "boolean") and (.web|type == "boolean")' "$RUNNER_TEMP/plan/plan.json" >/dev/null || { echo 'Deployment plan does not match the target SHA or component flags' >&2; exit 1; }
          jq -e '.api_sha | test("^[a-f0-9]{40}$")' "$RUNNER_TEMP/plan/plan.json" >/dev/null || { echo 'Invalid API image SHA in deployment plan' >&2; exit 1; }
          jq -e '.web_sha | test("^[a-f0-9]{40}$")' "$RUNNER_TEMP/plan/plan.json" >/dev/null || { echo 'Invalid web image SHA in deployment plan' >&2; exit 1; }
          echo "image_run=$IMAGE_RUN" >> "$GITHUB_OUTPUT"
  deploy:
    permissions:
      contents: read
      actions: read
      deployments: write
      packages: read
    needs: preflight
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - name: Download the verified immutable image plan
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_RUN: ${{ needs.preflight.outputs.image-run }}
        run: gh run download "$IMAGE_RUN" --repo "$GITHUB_REPOSITORY" --name deployment-plan --dir "$RUNNER_TEMP/plan"
      - name: Record deployment of the exact target (dispatch ref may differ)
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.sha }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          id=$(jq -n --arg ref "$TARGET" --arg environment "$ENVIRONMENT" '{ref:$ref,environment:$environment,task:"ttd-deploy",auto_merge:false,required_contexts:[]}' | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=in_progress --silent
      - uses: ./.github/actions/render-env
        with:
          output: ${{ runner.temp }}/runtime.env
        env:
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - name: Transfer deployment files and run pull-only deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
          RUNTIME_ENV_FILE: ${{ vars.RUNTIME_ENV_FILE }}
          PUBLIC_HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL }}
          TARGET: ${{ inputs.sha }}
          ENVIRONMENT: ${{ inputs.environment }}
          EDGE_NETWORK: ${{ vars.EDGE_NETWORK }}
          CADDY_SITES_DIR: ${{ vars.CADDY_SITES_DIR }}
          EDGE_CADDY_CONTAINER: ${{ vars.EDGE_CADDY_CONTAINER }}
        run: bash deploy/lib/remote.sh
      - name: Record deployment result for staging evidence and last-good
        if: always() && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          RESULT: ${{ job.status }}
        run: |
          state=failure; [[ "$RESULT" != success ]] || state=success
          gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" -f "state=$state" --silent
      - name: Remove runner private files
        if: always()
        run: rm -f "$RUNNER_TEMP/runtime.env" "$RUNNER_TEMP/deploy-key" "$RUNNER_TEMP/known-hosts"
