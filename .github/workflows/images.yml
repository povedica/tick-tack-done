name: Images
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  packages: read
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      api: ${{ steps.paths.outputs.api }}
      web: ${{ steps.paths.outputs.web }}
      environments: ${{ steps.config.outputs.environments }}
      deploy: ${{ steps.paths.outputs.deploy }}
      api_sha: ${{ steps.revisions.outputs.api_sha }}
      web_sha: ${{ steps.revisions.outputs.web_sha }}
      api_short: ${{ steps.revisions.outputs.api_short }}
      web_short: ${{ steps.revisions.outputs.web_short }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: revisions
        name: Resolve revisions independently of the previous push
        run: |
          python3 scripts/ci/image-plan.py > "$RUNNER_TEMP/component-plan.json"
          jq -r '"api_sha=\(.api_sha)\nweb_sha=\(.web_sha)\napi_short=\(.api_sha[0:7])\nweb_short=\(.web_sha[0:7])"' "$RUNNER_TEMP/component-plan.json" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: paths
        with:
          filters: |
            common: &common
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.dockerignore'
              - 'tsconfig.base.json'
              - '.github/workflows/images.yml'
              - 'scripts/ci/image-plan.py'
              - 'packages/domain/**'
            deploy:
              - 'deploy/**'
              - 'scripts/backup.sh'
              - 'scripts/backup-to-drive.mjs'
            api:
              - *common
              - 'apps/api/**'
            web:
              - *common
              - 'apps/web/**'
              - 'packages/sdk/**'
              - 'integrations/raycast/**'
      - name: Require main CI before making deployable images available
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=''
          for _ in {1..60}; do
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=10" --jq '[.workflow_runs[] | select(.head_branch == "main")][0].conclusion // empty')
            case "$conclusion" in
              success) break ;;
              failure|cancelled|timed_out|action_required) echo 'Main CI did not pass' >&2; exit 1 ;;
            esac
            sleep 5
          done
          [[ "$conclusion" == success ]] || { echo 'Timed out waiting for main CI' >&2; exit 1; }
      - name: Check manually created environments without creating any
        id: config
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments" > "$RUNNER_TEMP/environments.json"
          if jq -e '[.environments[].name] | (index("staging") != null and index("production") != null)' "$RUNNER_TEMP/environments.json" >/dev/null; then
            echo 'environments=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::M4 pending: Pablo must create staging and production. Web publishing is blocked.'
          fi

  api:
    permissions:
      contents: read
      packages: write
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve an already published SHA
        id: existing
        env:
          IMAGE: ghcr.io/povedica/tick-tack-done-api:${{ needs.changes.outputs.api_sha }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          fi
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/povedica/tick-tack-done-api
          tags: |
            type=raw,value=sha-${{ needs.changes.outputs.api_short }}
            type=raw,value=${{ needs.changes.outputs.api_sha }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
      - uses: docker/build-push-action@v7
        if: steps.existing.outputs.exists != 'true'
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_COMMIT=${{ needs.changes.outputs.api_sha }}
            BUILD_TIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Smoke published API and migration failure isolation
        env:
          IMAGE: ghcr.io/povedica/tick-tack-done-api:${{ needs.changes.outputs.api_sha }}
        run: |
          docker pull "$IMAGE"
          bash scripts/ci/test-migrations.sh "$IMAGE"

  web:
    permissions:
      contents: read
      packages: write
    needs: changes
    if: needs.changes.outputs.environments == 'true' && (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
    strategy:
      matrix:
        include:
          - environment: staging
            suffix: staging
          - environment: staging
            suffix: prod
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve an already published SHA
        id: existing
        env:
          IMAGE: ghcr.io/povedica/tick-tack-done-web:${{ needs.changes.outputs.web_sha }}-${{ matrix.suffix }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/povedica/tick-tack-done-web
          tags: |
            type=raw,value=sha-${{ needs.changes.outputs.web_short }}-${{ matrix.suffix }}
            type=raw,value=${{ needs.changes.outputs.web_sha }}-${{ matrix.suffix }}
            type=raw,value=main-${{ matrix.suffix }},enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag,suffix=-${{ matrix.suffix }}
      - name: Require the variant reCAPTCHA site key before publishing
        if: steps.existing.outputs.exists != 'true'
        env:
          SITE_KEY: ${{ vars[matrix.suffix == 'prod' && 'VITE_RECAPTCHA_PRODUCTION_SITE_KEY' || 'VITE_RECAPTCHA_SITE_KEY'] }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          variable=VITE_RECAPTCHA_SITE_KEY
          [[ "$SUFFIX" != prod ]] || variable=VITE_RECAPTCHA_PRODUCTION_SITE_KEY
          if [[ -z "$SITE_KEY" ]]; then
            echo "::error::Missing $variable: configure it in Environment staging or as a repository variable before publishing the $SUFFIX web image."
            exit 1
          fi
      - uses: docker/build-push-action@v7
        if: steps.existing.outputs.exists != 'true'
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_COMMIT=${{ needs.changes.outputs.web_sha }}
            BUILD_TIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VITE_RECAPTCHA_SITE_KEY=${{ vars[matrix.suffix == 'prod' && 'VITE_RECAPTCHA_PRODUCTION_SITE_KEY' || 'VITE_RECAPTCHA_SITE_KEY'] }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=${{ matrix.suffix == 'prod' && 'production' || 'staging' }}
            SENTRY_SOURCEMAPS=${{ secrets.SENTRY_AUTH_TOKEN != '' }}
          cache-from: type=gha,scope=web-${{ matrix.suffix }}
          cache-to: |
            type=gha,mode=max,scope=web-${{ matrix.suffix }}
            type=local,dest=${{ runner.temp }}/web-build-cache,mode=max
      - name: Upload web source maps to Sentry
        if: steps.existing.outputs.exists != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository))
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_URL: ${{ vars.SENTRY_URL || 'https://de.sentry.io/' }}
          WEB_SHA: ${{ needs.changes.outputs.web_sha }}
          BUILD_TIME: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          RECAPTCHA: ${{ vars[matrix.suffix == 'prod' && 'VITE_RECAPTCHA_PRODUCTION_SITE_KEY' || 'VITE_RECAPTCHA_SITE_KEY'] }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ matrix.suffix == 'prod' && 'production' || 'staging' }}
          MAPS: ${{ runner.temp }}/web-sourcemaps
          CACHE: ${{ runner.temp }}/web-build-cache
        run: |
          set -euo pipefail
          if [[ -z ${SENTRY_AUTH_TOKEN:-} ]]; then
            echo 'SENTRY_AUTH_TOKEN absent: web source maps not uploaded' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          fail() {
            echo "::warning::$1"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          [[ -d $CACHE ]] || fail 'Web build cache missing; source maps were not taken from the image build'
          if ! log=$(docker buildx build --file apps/web/Dockerfile --target sourcemaps \
            --build-arg "GIT_COMMIT=$WEB_SHA" --build-arg "BUILD_TIME=$BUILD_TIME" \
            --build-arg "VITE_RECAPTCHA_SITE_KEY=$RECAPTCHA" --build-arg "VITE_SENTRY_DSN=$VITE_SENTRY_DSN" \
            --build-arg "VITE_SENTRY_ENVIRONMENT=$VITE_SENTRY_ENVIRONMENT" --build-arg SENTRY_SOURCEMAPS=true \
            --cache-from "type=local,src=$CACHE" \
            --output "type=local,dest=$MAPS" --progress=plain . 2>&1); then
            printf '%s\n' "$log"
            fail 'Web source map export failed'
          fi
          printf '%s\n' "$log"
          python3 -c 'import sys; log=sys.stdin.read(); i=log.find("split-sourcemaps"); window=log[i:i+500] if i>=0 else ""; sys.exit(0 if i>=0 and "CACHED" in window else 1)' <<<"$log" \
            || fail 'Source maps were rebuilt instead of reused from the image build'
          release="ttd-web@$(jq -r .version apps/web/package.json)+${WEB_SHA:0:7}"
          npx --yes @sentry/cli@3.8.2 releases new "$release" --org "$SENTRY_ORG" --project ttd-web \
            || fail 'Web source map upload failed'
          # shellcheck disable=SC2088 # '~/' is Sentry's any-host URL prefix, not a path.
          npx --yes @sentry/cli@3.8.2 sourcemaps upload --org "$SENTRY_ORG" --project ttd-web \
            --release "$release" --url-prefix '~/' "$MAPS" \
            || fail 'Web source map upload failed'
          rm -rf "$MAPS"
      - name: Smoke published web
        env:
          IMAGE: ghcr.io/povedica/tick-tack-done-web:${{ needs.changes.outputs.web_sha }}-${{ matrix.suffix }}
        run: |
          docker pull "$IMAGE"
          name="ttd-web-smoke-$GITHUB_RUN_ID"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" "$IMAGE"
          for _ in {1..15}; do
            if docker exec "$name" wget -q -O /dev/null http://127.0.0.1:8080/; then exit 0; fi
            sleep 1
          done
          exit 1

  deployment-plan:
    needs: [changes, api, web]
    if: always() && needs.changes.result == 'success' && needs.api.result == 'success' && needs.web.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Record both desired immutable component revisions
        env:
          API_SHA: ${{ needs.changes.outputs.api_sha }}
          WEB_SHA: ${{ needs.changes.outputs.web_sha }}
        run: |
          jq -n --arg sha "$GITHUB_SHA" --arg api_sha "$API_SHA" --arg web_sha "$WEB_SHA" '{sha:$sha,api:true,web:true,api_sha:$api_sha,web_sha:$web_sha}' > deploy/plan.json
      - uses: actions/upload-artifact@v7
        with:
          name: deployment-plan
          path: deploy/plan.json
          retention-days: 30
