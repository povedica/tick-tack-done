<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>
:root{--bg:#fff;--fg:#1d2230;--mut:#5f6673;--line:#e3e6ec;--card:#f6f7fb;--acc:#4f5bd5;--acc2:#eef0ff;--ok:#15803d;--warn:#b45309;--bad:#c62828;--blk:#dfe3ff;--ev:#fde2df}
.dark{--bg:#13151b;--fg:#e9ebf1;--mut:#a0a7b4;--line:#2b2f3a;--card:#1b1e26;--acc:#8d95ff;--acc2:#262a47;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--blk:#2e3363;--ev:#4b2b2b}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
.wm{position:fixed;right:8px;top:2px;font-size:10px;color:var(--mut);z-index:9}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 8px}.mut{color:var(--mut)}.s{font-size:12.5px}
.row{display:flex;align-items:center;gap:8px}.grow{flex:1;min-width:0}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--acc2);white-space:nowrap}
.cap{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.bar{height:10px;border-radius:5px;background:var(--line);position:relative;overflow:hidden;margin:6px 0 4px}.bar i{position:absolute;top:0;bottom:0}
.legend{display:flex;gap:10px;font-size:11px;color:var(--mut);flex-wrap:wrap}.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc)}
.task{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--bg);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.task .ttl{font-size:19px;font-weight:600;margin:4px 0 6px}.why{font-size:13px;color:var(--mut)}
.sug{margin-top:10px;padding:8px 10px;border-radius:10px;background:var(--acc2);font-size:13px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.act{display:flex;gap:10px;align-items:center;min-height:52px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:15px;text-align:left}
.act small{display:block;font-size:11.5px;color:var(--mut)}.act .ic{width:22px;text-align:center;font-size:17px}
.act.rec{border:2px solid var(--acc);background:var(--acc2)}.act.danger{color:var(--bad)}
.act kbd,.k{font:11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--mut);margin-left:auto}
.btn{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.foot{margin-top:auto;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center}
.sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:14px 0 6px;display:flex;justify-content:space-between}
.li{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;font-size:13.5px}.li.cur{background:var(--acc2);font-weight:600}.li .lab{width:62px;font-size:11.5px;color:var(--mut)}
.tl{position:relative;border-left:1px solid var(--line);margin-left:38px}.hr{height:38px;border-top:1px dashed var(--line);position:relative}.hr span{position:absolute;left:-38px;top:-8px;font-size:11px;color:var(--mut)}
.blk{position:absolute;left:6px;right:6px;border-radius:7px;padding:2px 7px;font-size:12px;background:var(--blk);overflow:hidden;white-space:nowrap}.blk.ev{background:var(--ev)}.blk.new{outline:2px solid var(--acc)}.blk.free{background:transparent;border:1px dashed var(--mut);color:var(--mut)}
.toast{border-radius:10px;padding:10px 12px;background:#1f2937;color:#fff;display:flex;justify-content:space-between;gap:10px}
.sheet{border-radius:16px 16px 0 0;border:1px solid var(--line);padding:14px;background:var(--bg);box-shadow:0 -8px 24px rgba(0,0,0,.15)}
.slot{display:flex;justify-content:space-between;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px}.slot.on{border:2px solid var(--acc);background:var(--acc2)}
.m{width:390px;min-height:844px;display:flex;flex-direction:column}.m .body{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:10px}
.d{width:1280px;height:800px;display:grid;grid-template-columns:290px 1fr 340px}.d>div{padding:18px;border-right:1px solid var(--line);overflow:hidden}
.dim{opacity:.35}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:60px 24px}
.big{font-size:44px}
</style></head><body><div class="wm">Boceto · Planifica tu día (propuesta, no producción)</div><div id="root"></div>
<script>
const q=new URLSearchParams(location.search);if(q.get('theme')==='dark')document.documentElement.classList.add('dark');
const v=q.get('v')||'m-card';
const capBar=(task,label,cls,extra='')=>`<div class="cap"><div class="row"><span class="grow s">Hoy · 9:00–18:00 · 1 h 30 de reuniones</span><span class="chip">sáb 24 oct</span></div>
<div class="row" style="margin-top:4px"><b class="${cls}" style="font-size:17px">${label}</b></div>
<div class="bar"><i style="left:0;width:17%;background:#f2a19a"></i><i style="left:17%;width:${task}%;background:var(--acc)"></i><i style="left:${17+task}%;width:${extra||0}%;background:repeating-linear-gradient(45deg,var(--acc) 0 3px,transparent 3px 6px)"></i><i style="left:85%;width:2px;background:var(--fg)"></i></div>
<div class="legend"><span><b style="background:#f2a19a"></b>Reuniones</span><span><b style="background:var(--acc)"></b>Tareas de hoy</span><span>| 85 % = margen para imprevistos</span></div></div>`;
const A=[['☀','Hoy','Sin hora · cuenta en tu día','H','rec'],['⏱','Bloque horario','Hoy 16:00–16:45 (hueco libre)','B',''],['→','Mañana','Dom 25 oct','M',''],['📅','Otro día…','Lunes, próxima semana, fecha','O',''],['☁','Algún día','Sin fecha, fuera de tu día','A',''],['✓','Completar','Ya está hecha','C',''],['⊘','No haré','Se guarda en «No haré»','N',''],['🗑','Eliminar','A la papelera (30 días)','Supr','danger']];
const acts=(kb)=>`<div class="acts">${A.map(a=>`<div class="act ${a[4]}"><span class="ic">${a[0]}</span><span class="grow">${a[1]}<small>${a[2]}</small></span>${kb?`<kbd>${a[3]}</kbd>`:''}</div>`).join('')}</div>`;
const task=(kb)=>`<div class="task"><div class="row"><span class="chip">Vencida hace 3 días</span><span class="chip">45 min</span><span class="chip">⚑ Media</span></div>
<div class="ttl">Revisar contrato del alquiler</div><div class="why">Lista: Casa · Inicio: mié 21 oct · Sin subtareas</div>
<div class="sug">💡 <b>Sugerencia: Hoy.</b> Está vencida y cabe (quedan 3 h 45 libres).</div>${acts(kb)}</div>`;
const tl=(nb)=>{const H=['9','10','11','12','13','14','15','16','17'];let s='<div class="tl">'+H.map(h=>`<div class="hr"><span>${h}:00</span></div>`).join('');
const b=(t,h,c,x)=>`<div class="blk ${c}" style="top:${t*38}px;height:${Math.max(h*38-3,17)}px">${x}</div>`;
s+=b(0,.5,'ev','Daily equipo')+b(.5,1.5,'','Preparar propuesta cliente')+b(3,1,'ev','Comida')+b(4,.5,'','Llamar al taller')+(nb?b(7,.75,'new','Revisar contrato (nuevo)'):b(7,.75,'free','hueco libre'))+b(2,1,'free','libre')+b(5,2,'free','libre');return s+'</div>'};
let h='';
if(v==='m-card'){h=`<div class="m"><div class="body">
<div class="row"><span class="mut">✕</span><b class="grow" style="text-align:center">Planifica tu día</b><span class="s mut">3 / 12</span></div>
<div class="prog"><i style="width:25%"></i></div>
<div class="row s"><span class="grow">Hoy: <b>4 h 15</b> de 7 h 30 libres</span><span class="ok">● cabe</span></div>
${task(false)}
</div><div class="foot"><button class="btn">↶ Deshacer</button><span class="grow"></span><button class="btn">Saltar →</button></div></div>`}
if(v==='m-intro'){h=`<div class="m"><div class="body">
<div class="row"><span class="mut">✕</span><b class="grow" style="text-align:center">Planifica tu día</b><span></span></div>
<h1 style="margin-top:8px">Decide qué haces hoy, tarea a tarea</h1>
<div class="mut">Te enseñamos cada pendiente y eliges qué hacer con él. Verás al momento si tu día cabe. Nada cambia hasta el final.</div>
${capBar(66,'Hoy tienes 6 h 10 de tareas para 7 h 30 libres','warn')}
<div class="sec"><span>Vamos a revisar 12 tareas</span><span>≈ 3 min</span></div>
<div class="li">☑ <span class="grow">Vencidas</span><span class="chip">5</span></div><div class="li">☑ <span class="grow">Previstas para hoy</span><span class="chip">4</span></div><div class="li">☑ <span class="grow">Rutinas de hoy</span><span class="chip">1</span></div><div class="li">☐ <span class="grow">Bandeja (sin ordenar)</span><span class="chip">7</span></div><div class="li">☐ <span class="grow">Sin fecha</span><span class="chip">25</span></div>
<div class="s mut">3 tareas no tienen duración: contamos 30 min. Podrás ajustarla en cada tarjeta.</div>
</div><div class="foot"><button class="btn">Ahora no</button><button class="btn pri grow">Empezar · 12 tareas</button></div></div>`}
if(v==='m-block'){h=`<div class="m"><div class="body dim">
<div class="row"><span class="mut">✕</span><b class="grow" style="text-align:center">Planifica tu día</b><span class="s mut">3 / 12</span></div><div class="prog"><i style="width:25%"></i></div>${task(false)}</div>
<div class="sheet" style="margin-top:-430px;position:relative"><div class="row"><b class="grow">Bloque horario · 45 min</b><span class="mut">✕</span></div>
<div class="s mut" style="margin:4px 0 10px">Huecos libres hoy en tu jornada (sin reuniones)</div>
<div class="slot on"><span><b>16:00 – 16:45</b></span><span class="s ok">primer hueco</span></div><div class="slot"><span>11:00 – 11:45</span><span class="s mut">antes de comer</span></div><div class="slot"><span>14:30 – 15:15</span><span class="s mut"></span></div>
<div class="row s" style="margin:6px 0 12px"><span class="grow">Duración</span><span class="chip">15 min</span><span class="chip">30 min</span><span class="chip" style="outline:2px solid var(--acc)">45 min</span><span class="chip">1 h</span></div>
<div class="row"><button class="btn">Elegir otra hora</button><button class="btn pri grow">Reservar 16:00</button></div></div></div>`}
if(v==='m-sum'){h=`<div class="m"><div class="body">
<div class="row"><span class="mut">✕</span><b class="grow" style="text-align:center">Resumen</b><span class="s mut">12 / 12</span></div><div class="prog"><i style="width:100%"></i></div>
<h1>Tu día queda así</h1>
${capBar(48,'Cabe: 5 h 05 de 7 h 30 libres','ok')}
<div class="sec"><span>Lo que has decidido</span><span>Editar</span></div>
<div class="li"><span class="lab">☀ Hoy</span><span class="grow">4 tareas · 2 h 35</span></div>
<div class="li"><span class="lab">⏱ Bloque</span><span class="grow">Revisar contrato · 16:00–16:45</span></div>
<div class="li"><span class="lab">→ Mañana</span><span class="grow">3 tareas · 1 h 30 (mañana queda al 64 %)</span></div>
<div class="li"><span class="lab">📅 Lunes</span><span class="grow">1 tarea</span></div>
<div class="li"><span class="lab">✓ Hecha</span><span class="grow">1 tarea</span></div>
<div class="li"><span class="lab">⊘ No haré</span><span class="grow">1 tarea</span></div>
<div class="li"><span class="lab">Saltadas</span><span class="grow">1 · se quedan como estaban</span></div>
<div class="s mut">Cambia la fecha de inicio; ninguna fecha límite se mueve.</div>
</div><div class="foot"><button class="btn">← Volver</button><button class="btn pri grow">Confirmar mi día</button></div></div>`}
if(v==='m-done'){h=`<div class="m"><div class="body"><div class="center"><div class="big">✓</div><h1>Día planificado</h1><div class="mut">11 cambios aplicados. Tienes 2 h 25 libres hoy.</div><button class="btn pri">Ir a Hoy</button><button class="btn">Ver el día en el calendario</button></div>
<div class="toast" style="margin-top:auto"><span>Día planificado · 11 cambios</span><b>Deshacer</b></div></div></div>`}
if(v==='m-empty'){h=`<div class="m"><div class="body"><div class="center"><div class="big">☀</div><h1>No hay nada pendiente para hoy</h1><div class="mut">No tienes tareas vencidas ni previstas para hoy. ¿Quieres traer algo de la Bandeja o de «Sin fecha»?</div><button class="btn pri">Revisar la Bandeja (7)</button><button class="btn">Volver a Hoy</button></div></div></div>`}
if(v==='m-error'){h=`<div class="m"><div class="body"><div class="row"><span class="mut">✕</span><b class="grow" style="text-align:center">Planifica tu día</b><span class="s mut">7 / 12</span></div>
<div class="center"><div class="big bad">!</div><h1>No hemos podido guardar tu día</h1><div class="mut">No hay conexión o el servidor no responde. Tus 7 decisiones siguen aquí; no se ha cambiado nada.</div><button class="btn pri">Reintentar</button><button class="btn">Seguir sin conexión y guardar luego</button></div>
<div class="cap s"><b>Una tarea cambió mientras planificabas</b><br>«Llamar al taller» se completó en otro dispositivo. La hemos quitado del resumen.</div></div></div>`}
if(v==='d-triage'){h=`<div class="d">
<div><div class="row"><h1 class="grow">Planifica tu día</h1></div><div class="s mut" style="margin:2px 0 10px">5 de 12 decididas · ≈ 2 min</div><div class="prog"><i style="width:42%"></i></div>
<div class="sec"><span>Vencidas</span><span>5</span></div>
<div class="li"><span class="lab ok">☀ Hoy</span><span class="grow">Preparar propuesta</span></div><div class="li"><span class="lab">→ Mañana</span><span class="grow">Ordenar fotos viaje</span></div><div class="li"><span class="lab">✓ Hecha</span><span class="grow">Pagar recibo luz</span></div>
<div class="li cur"><span class="lab">● ahora</span><span class="grow">Revisar contrato alquiler</span></div><div class="li"><span class="lab"></span><span class="grow">Renovar DNI</span></div>
<div class="sec"><span>Previstas para hoy</span><span>4</span></div><div class="li"><span class="lab ok">☀ Hoy</span><span class="grow">Llamar al taller</span></div><div class="li"><span class="lab">⊘ No haré</span><span class="grow">Leer informe Q3</span></div><div class="li"><span class="lab"></span><span class="grow">Comprar regalo</span></div><div class="li"><span class="lab"></span><span class="grow">Enviar factura</span></div>
<div class="sec"><span>Rutinas</span><span>1</span></div><div class="li"><span class="lab"></span><span class="grow">↻ Repaso diario</span></div>
<div class="s mut" style="margin-top:12px"><span class="k">↑</span> <span class="k">↓</span> moverse · clic para volver a una tarea</div></div>
<div style="background:var(--card)"><div class="row s mut"><span class="grow">Tarea 6 de 12</span><span><span class="k">Espacio</span> saltar · <span class="k">Z</span> deshacer · <span class="k">?</span> atajos</span></div>
<div style="max-width:560px;margin:18px auto 0">${task(true)}</div></div>
<div><h2>Así va tu día</h2>${capBar(41,'3 h 50 de 7 h 30 libres · cabe','ok','10')}
<div class="s mut" style="margin:6px 0 10px">Si eliges <b>Bloque horario</b>: 16:00–16:45 (rayado)</div>${tl(true)}
<div class="row" style="margin-top:14px"><button class="btn">Terminar luego</button><button class="btn pri grow">Revisar y confirmar (5)</button></div></div></div>`}
document.getElementById('root').innerHTML=h;
</script></body></html>
