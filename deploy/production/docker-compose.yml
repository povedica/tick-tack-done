# Pila propia de todo.reflexionia.com en el mismo host que ia.turugby.
# No publica 80 ni 443: el Caddy de turugby-production ya los tiene.
# Los alias todo-api y todo-web son los nombres que usa deploy/production/todo.caddy.
name: todo

services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:-/etc/todo/production.env}
    environment:
      NODE_ENV: production
      AUTH_MODE: ''
      BUS_AUTOSTART: 'true'
      SCHEDULER_AUTOSTART: 'true'
      ATTACHMENT_DIR: /data/attachments
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?connection_limit=10&pool_timeout=20
      REDIS_URL: redis://redis:6379
    volumes:
      - attachments:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      private: {}
      edge:
        aliases:
          - todo-api

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    networks:
      private: {}
      edge:
        aliases:
          - todo-web

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - private

networks:
  private:
    internal: true
  edge:
    external: true
    name: turugby-production_public

volumes:
  pgdata:
  redisdata:
  attachments:
